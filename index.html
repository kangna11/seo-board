<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>SEO 小组流量驾驶舱</title>
<style>img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body style="margin:0;background:#070b11">
<script>window.__DEFER_BOOT__=1;</script>
<title>SEO 小组流量驾驶舱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* 仪表盘风格：固定深色，不跟随系统主题 —— 驾驶舱就该是暗的。
   所有颜色都显式声明，不依赖宿主背景。 */
:root{
  --void:#070b11; --panel:#0e1621; --panel2:#131e2c; --panel3:#0b131d;
  --rule:#1c2938; --rule2:#2a3b4f; --glow:rgba(53,200,232,.14);
  --ink:#dde7f3; --ink2:#8fa3bb; --ink3:#5c7089; --ink4:#3d4c5f;
  --cyan:#35c8e8; --good:#36d6a0; --warn:#e9b53c; --bad:#f2665c;
  --m1:#35c8e8; --m2:#36d6a0; --m3:#e9b53c; --m4:#c07fff;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--void);color:var(--ink);font-size:14px;line-height:1.55;
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.mono,.n{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",ui-monospace,Menlo,monospace}
.wrap{max-width:1460px;margin:0 auto;padding:16px 16px 56px;display:flex;flex-direction:column;gap:12px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  font-family:"JetBrains Mono",monospace}

/* ---------- 顶部指挥条 ---------- */
.cmd{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--rule2);
  display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;padding:12px 16px}
.brand{display:flex;flex-direction:column;gap:1px;border-right:1px solid var(--rule);padding-right:18px}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.brand .sub{font-size:10.5px;color:var(--ink3);font-family:"JetBrains Mono",monospace}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--good)}
.led{width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.readouts{display:flex;gap:26px;flex-wrap:wrap}
.ro{display:flex;flex-direction:column;gap:0}
.ro .v{font-size:27px;font-weight:700;line-height:1.05;letter-spacing:-.02em;
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.ro .k{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);
  font-family:"JetBrains Mono",monospace}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink2)}

/* ---------- 控件条 ---------- */
.ctl{background:var(--panel);border:1px solid var(--rule);padding:9px 14px;
  display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.seg{display:flex;border:1px solid var(--rule2)}
.seg button{appearance:none;font:inherit;font-size:12px;padding:5px 13px;cursor:pointer;
  background:transparent;color:var(--ink2);border:none;border-left:1px solid var(--rule2);
  font-family:"JetBrains Mono",monospace;transition:background .12s,color .12s}
.seg button:first-child{border-left:none}
.seg button:hover{background:var(--panel2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--cyan);color:#06222b;font-weight:700}
input[type=date],input[type=number]{font:inherit;font-size:12px;padding:4px 7px;background:var(--panel3);
  color:var(--ink);border:1px solid var(--rule2);font-family:"JetBrains Mono",monospace}
input[type=number]{width:54px}
input:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 2px var(--glow)}
.ctl .grp{display:flex;align-items:center;gap:7px}

/* ---------- 仪表板 ---------- */
.bays{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bay{background:var(--panel);border:1px solid var(--rule);display:flex;flex-direction:column;
  position:relative;overflow:hidden}
.bay::before{content:"";position:absolute;inset:0 0 auto 0;height:2px;background:var(--mc)}
.bay .hd{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 13px 8px;border-bottom:1px solid var(--rule)}
.bay .hd b{font-size:15px;font-weight:700;color:var(--mc)}
.pos{font-size:10px;font-family:"JetBrains Mono",monospace;color:var(--ink3);
  border:1px solid var(--rule2);padding:1px 6px}
.pos.p1{color:var(--good);border-color:var(--good)}
.gaugebox{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:10px 13px}
.gstat{display:flex;flex-direction:column;gap:3px;min-width:0}
.gstat .big{font-size:30px;font-weight:700;line-height:1;letter-spacing:-.025em;color:var(--ink);
  font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.gstat .cap{font-size:10.5px;color:var(--ink3);font-family:"JetBrains Mono",monospace}
.gstat .cmp{font-size:11.5px;color:var(--ink2);font-family:"JetBrains Mono",monospace;
  display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.bay .meta{display:flex;justify-content:space-between;padding:0 13px 9px;font-size:11px;
  color:var(--ink3);font-family:"JetBrains Mono",monospace}
.bay .meta b{color:var(--ink2);font-weight:500}
.tierbar{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}
.tb{appearance:none;font:inherit;cursor:pointer;background:transparent;border:none;
  border-left:1px solid var(--rule);padding:8px 6px;display:flex;flex-direction:column;
  align-items:center;gap:1px;transition:background .12s}
.tb:first-child{border-left:none}
.tb:hover{background:var(--panel2)}
.tb[aria-expanded="true"]{background:var(--panel2);box-shadow:inset 0 -2px 0 var(--tc)}
.tb .c{font-size:19px;font-weight:700;color:var(--tc);font-family:"JetBrains Mono",monospace;line-height:1.1}
.tb .t{font-size:10px;color:var(--ink3);font-family:"JetBrains Mono",monospace}
.dl{display:none;border-top:1px solid var(--rule);background:var(--panel3);max-height:230px;overflow:auto;
  padding:8px 12px 10px}
.dl.on{display:block}
.dl ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.dl li{display:flex;justify-content:space-between;gap:8px;font-size:11px;
  font-family:"JetBrains Mono",monospace;color:var(--ink2)}
.dl li span:last-child{color:var(--ink3)}
.dl .mo{margin-top:6px;font-size:10.5px;color:var(--ink4)}
.sparkbox{padding:0 10px 9px}

/* ---------- 面板通用 ---------- */
.panel{background:var(--panel);border:1px solid var(--rule)}
.phd{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 13px;border-bottom:1px solid var(--rule);background:var(--panel2)}
.phd h2{margin:0;font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink2);
  font-family:"JetBrains Mono",monospace}
.phd .hint{font-size:11px;color:var(--ink3)}
.pbd{padding:12px 13px}
.row2{display:grid;grid-template-columns:1.55fr 1fr;gap:10px;align-items:start}

/* ---------- 告警 ---------- */
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:9px 13px;border-bottom:1px solid var(--rule);
  font-size:12.5px;align-items:start}
.al:last-child{border-bottom:none}
.al .tag{font-size:9.5px;letter-spacing:.1em;font-family:"JetBrains Mono",monospace;
  color:var(--sv);border:1px solid var(--sv);padding:1px 5px;white-space:nowrap;margin-top:2px}
.al .msg{color:var(--ink2)}
.al .msg b{color:var(--ink);font-weight:500}
.al .msg code{font-family:"JetBrains Mono",monospace;color:var(--cyan);font-size:11.5px}

/* ---------- 表 ---------- */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:720px}
th,td{padding:7px 11px;text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap}
th{background:var(--panel3);font-size:10px;font-weight:500;color:var(--ink3);letter-spacing:.08em;
  text-transform:uppercase;font-family:"JetBrains Mono",monospace;position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left}
tbody tr:hover td{background:var(--panel2)}
tbody tr:last-child td{border-bottom:none}
td.n,th.n{font-variant-numeric:tabular-nums;font-family:"JetBrains Mono",monospace}
td.dom{font-family:"JetBrains Mono",monospace;font-size:12px}
.who{display:inline-flex;align-items:center;gap:6px}
.who i{width:7px;height:7px;flex:none}
tfoot td{font-weight:700;background:var(--panel3);border-top:1px solid var(--rule2);color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:13px;font-size:11px;color:var(--ink2);padding:8px 13px 0;
  font-family:"JetBrains Mono",monospace}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px}

.state{padding:50px 20px;text-align:center;color:var(--ink3);font-size:13px}
.state b{display:block;color:var(--bad);margin-bottom:6px}
.retry{appearance:none;font:inherit;font-size:12px;margin-top:10px;padding:5px 14px;cursor:pointer;
  background:transparent;border:1px solid var(--rule2);color:var(--ink2)}
.retry:hover{border-color:var(--cyan);color:var(--cyan)}
footer{color:var(--ink4);font-size:11px;display:flex;flex-direction:column;gap:3px;padding-top:4px}
footer b{color:var(--ink3);font-weight:500}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media (max-width:1180px){.bays{grid-template-columns:repeat(2,1fr)}.row2{grid-template-columns:1fr}}
@media (max-width:620px){.bays{grid-template-columns:1fr}.cmd{grid-template-columns:1fr}
  .brand{border-right:none;border-bottom:1px solid var(--rule);padding:0 0 8px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">

  <div class="cmd">
    <div class="brand">
      <h1>SEO 小组流量驾驶舱</h1>
      <div class="sub"><span class="live"><i class="led"></i>LIVE</span> · 更新 <span id="upd">—</span></div>
    </div>
    <div class="readouts" id="readouts"></div>
    <div class="lbl" id="rangeTag">—</div>
  </div>

  <div class="ctl">
    <div class="grp">
      <span class="lbl">区间</span>
      <div class="seg" id="presets">
        <button data-p="today">今日</button>
        <button data-p="yday">昨日</button>
        <button data-p="7">7 天</button>
        <button data-p="30">30 天</button>
      </div>
      <input type="date" id="d1"><span style="color:var(--ink4)">→</span><input type="date" id="d2">
    </div>
    <div class="grp">
      <span class="lbl">分档阈值 / 日均 IP</span>
      <span style="font-size:12px;color:var(--ink2)">无效&lt;</span><input type="number" id="thBad" min="1">
      <span style="font-size:12px;color:var(--ink2)">有效≥</span><input type="number" id="thGood" min="2">
    </div>
  </div>

  <div id="boot" class="panel state">正在接入 51.LA 数据…</div>
  <div id="app" hidden></div>

  <footer>
    <div>全部按<b>主域名</b>统计，<b>www.x.cc</b> 与随机前缀二级域名已并入 <b>x.cc</b>。数据源 51.LA，明细保留上限 90 天。</div>
    <div>分档按区间内<b>日均 IP</b>；今天是半天数据，已按<b>过去的小时数折算成全天速率</b>，不会把有效域名算少。</div>
  </footer>
</div>

<script>
/* ===================== 常量 ===================== */
/* 成员名单来自数据本身，不写死在页面里 —— 公开版页面上不留任何明文 */
let MEMBERS=[], MCOL={}, MHEX={};
const PALETTE=["#35c8e8","#36d6a0","#e9b53c","#c07fff","#f2665c","#7aa6ff"];
function setMembers(list){
  MEMBERS=list.slice(); MCOL={}; MHEX={};
  MEMBERS.forEach((m,i)=>{const c=PALETTE[i%PALETTE.length]; MHEX[m]=c; MCOL[m]=c;});
}
const fmt=n=>(n||0).toLocaleString("en-US");
const iso=d=>d.toISOString().slice(0,10);
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return iso(d);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const S={db:null,rollup:null,meta:null,cache:new Map(),d1:null,d2:null,
  th:{bad:5,good:30},open:{},latest:null,busy:false};

/* ===================== 接数据 ===================== */
async function boot(){
  const el=document.getElementById("boot");
  el.innerHTML="正在接入 51.LA 数据…";
  try{
    /* 数据在生成页面时就烤进来了，打开即看，不需要登录也不联网 */
    const D=window.__DATA__;
    if(!D||!D.rollup||!D.rollup.days)
      throw new Error("这个页面没有带数据 —— 重新跑一次 update.sh 生成。");
    S.meta=D.meta||{}; S.rollup=D.rollup;
    Object.entries(D.days||{}).forEach(([k,v])=>S.cache.set(k,v));
    finishBoot(el);
  }catch(e){
    el.hidden=false; document.getElementById("app").hidden=true;
    el.innerHTML=`<b>接不上数据</b>${esc(e.message||e)}<br><button class="retry" onclick="boot()">重试</button>`;
  }
}

function finishBoot(el){
  const days=Object.keys(S.rollup.days).sort();
  setMembers(S.meta.members&&S.meta.members.length
    ? S.meta.members
    : Object.keys(S.rollup.days[days[days.length-1]]||{}));
  if(S.meta.thresholds) S.th={...S.th,...S.meta.thresholds};
  document.getElementById("thBad").value=S.th.bad;
  document.getElementById("thGood").value=S.th.good;
  document.getElementById("upd").textContent=S.meta.updatedAt||"—";
  const all=days;
  S.latest=all[all.length-1];
  /* 日期下限取「有域名明细」的起点，往前只有日汇总，选了也看不到分档 */
  S.earliest=S.meta.detailFrom||all[0];
  document.getElementById("d1").min=S.earliest; document.getElementById("d2").min=S.earliest;
  document.getElementById("d1").max=S.latest;   document.getElementById("d2").max=S.latest;
  el.hidden=true; document.getElementById("app").hidden=false;
  setRange(S.latest,S.latest,"today");
}

async function loadDays(dates){
  /* 超出明细范围的日期没有数据，当作空处理 */
  dates.forEach(d=>{ if(!S.cache.has(d)) S.cache.set(d,null); });
  return dates.map(d=>S.cache.get(d)).filter(Boolean);
}
function parseDom(s){const o={};if(!s)return o;
  for(const p of s.split("|")){const i=p.lastIndexOf(":");if(i<0)continue;o[p.slice(0,i)]=+p.slice(i+1)||0;}
  return o;}
function aggregate(docs){
  const out={}; MEMBERS.forEach(m=>out[m]={ip:0,pv:0,uv:0,dom:{}});
  for(const doc of docs) for(const m of MEMBERS){
    const r=doc&&doc.m&&doc.m[m]; if(!r) continue;
    const t=r.t||[0,0,0];
    out[m].ip+=t[0]||0; out[m].pv+=t[1]||0; out[m].uv+=t[2]||0;
    const dm=parseDom(r.dom); for(const k in dm) out[m].dom[k]=(out[m].dom[k]||0)+dm[k];
  }
  return out;
}
function tierSplit(dom,days,th){
  const bad=[],mid=[],good=[];
  for(const k in dom){const total=dom[k],avg=total/days,row=[k,total,avg];
    if(avg<th.bad) bad.push(row); else if(avg<th.good) mid.push(row); else good.push(row);}
  const by=(a,b)=>b[1]-a[1]; bad.sort(by);mid.sort(by);good.sort(by);
  return {bad,mid,good};
}
function rangeDates(a,b){const o=[];let d=a,g=0;while(d<=b&&g++<400){o.push(d);d=addDays(d,1);}return o;}
function setRange(a,b,preset){
  S.d1=a;S.d2=b;S.preset=preset||"";
  document.getElementById("d1").value=a; document.getElementById("d2").value=b;
  document.querySelectorAll("#presets button").forEach(x=>
    x.setAttribute("aria-pressed", x.dataset.p===preset));
  render();
}

/* ===================== 绘图件 ===================== */
function gauge(ratio,hex){
  /* 半圆表：正中间 12 点钟 = 与基准持平，左边掉量右边涨量 */
  const W=104,H=62,cx=52,cy=55,r=40,sw=8;
  const t=Math.max(0,Math.min(2,isFinite(ratio)?ratio:0))/2;   // 0..1，0.5 = 持平
  const pt=a=>[(cx+r*Math.cos(a)).toFixed(2),(cy-r*Math.sin(a)).toFixed(2)];
  const A0=Math.PI, A1=Math.PI*(1-t);
  const [x0,y0]=pt(A0), [x1,y1]=pt(A1), [xe,ye]=pt(0);
  const [tx,ty]=pt(Math.PI/2), [tx2,ty2]=[cx,(cy-r+10)];
  const col=t>0.5?"var(--good)":t<0.46?"var(--bad)":"var(--warn)";
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="与基准相比 ${Math.round(ratio*100)}%">
    <path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${xe} ${ye}" fill="none" stroke="var(--rule2)" stroke-width="${sw}"/>
    <path d="M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}" fill="none" stroke="${col}" stroke-width="${sw}"/>
    <line x1="${cx}" y1="${cy-r+sw/2+1}" x2="${cx}" y2="${cy-r-sw/2+1}" stroke="var(--ink3)" stroke-width="1.5"/>
    <text x="${cx}" y="${cy-8}" text-anchor="middle" fill="${col}" font-size="15" font-weight="700"
      font-family="JetBrains Mono, monospace">${Math.round(ratio*100)}%</text>
    <text x="${cx}" y="${cy+4}" text-anchor="middle" fill="var(--ink4)" font-size="7.5"
      letter-spacing="1" font-family="JetBrains Mono, monospace">VS 基准</text>
  </svg>`;
}
function spark(series,hex){
  const W=260,H=30,n=series.length; if(!n) return "";
  const max=Math.max(...series,1), bw=W/n;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none" role="img" aria-label="区间每日 IP">`;
  s+=`<line x1="0" y1="${H-.5}" x2="${W}" y2="${H-.5}" stroke="var(--rule)"/>`;
  series.forEach((v,i)=>{const h=Math.max(1,(H-2)*v/max);
    s+=`<rect x="${(i*bw+bw*.16).toFixed(2)}" y="${(H-1-h).toFixed(2)}" width="${(bw*.68).toFixed(2)}" height="${h.toFixed(2)}" fill="${hex}" opacity="${v===max?.95:.4}"/>`;});
  return s+"</svg>";
}
function deltaHtml(cur,base){
  if(!base) return '<span class="flat">—</span>';
  const p=(cur-base)/base*100, cls=p>1.5?"up":p<-1.5?"down":"flat";
  return `<span class="${cls}">${p>0?"▲":p<0?"▼":"·"} ${Math.abs(p).toFixed(1)}%</span>`;
}

/* ===================== 主渲染 ===================== */
async function render(){
  if(S.busy) return; S.busy=true;
  const app=document.getElementById("app");
  try{
    const dates=rangeDates(S.d1,S.d2);
    const docs=await loadDays(dates);
    const cur=aggregate(docs);
    const lastDoc=S.cache.get(S.d2);
    const lastHrs=(lastDoc&&lastDoc.hrs)||24;
    const nCal=dates.length, nDays=nCal-1+lastHrs/24;
    const dayLabel=nCal===1?(lastHrs<24?`今日 IP · 已过 ${lastHrs} 小时`:"当日 IP"):`${nCal} 天合计 IP`;

    let base={},baseLabel="";
    if(nCal===1&&S.d1===S.latest){
      MEMBERS.forEach(m=>base[m]=(lastDoc&&lastDoc.m&&lastDoc.m[m]&&lastDoc.m[m].ySoFar)||0);
      baseLabel="昨日此时";
    }else{
      const pd=rangeDates(addDays(S.d1,-nCal),addDays(S.d1,-1));
      const p=aggregate(await loadDays(pd));
      MEMBERS.forEach(m=>base[m]=p[m].ip);
      baseLabel=nCal===1?"前一天":`上一个 ${nCal} 天`;
    }
    const ctx={cur,base,baseLabel,nDays,nCal,dates,dayLabel,lastHrs};
    document.getElementById("rangeTag").textContent=
      (nCal===1?S.d1:`${S.d1} → ${S.d2}`)+`  ·  ${nCal} 天`;
    paintReadouts(ctx);
    app.innerHTML=paintBays(ctx)+paintMid(ctx)+paintWeek()+paintTables(ctx);
    drawStack(dates);
    bindAfter();
  }catch(e){
    app.innerHTML=`<div class="panel state"><b>渲染出错</b>${esc(e.message||e)}</div>`;
  }finally{ S.busy=false; }
}

function paintReadouts({cur,base,baseLabel,nDays,nCal}){
  const tot=MEMBERS.reduce((a,m)=>a+cur[m].ip,0);
  const tb=MEMBERS.reduce((a,m)=>a+base[m],0);
  const splits=MEMBERS.map(m=>tierSplit(cur[m].dom,nDays,S.th));
  const G=splits.reduce((a,s)=>a+s.good.length,0);
  const D=splits.reduce((a,s)=>a+s.good.length+s.mid.length+s.bad.length,0);
  const ranked=[...MEMBERS].sort((a,b)=>cur[b].ip-cur[a].ip);
  const gap=cur[ranked[0]].ip/Math.max(cur[ranked[3]].ip,1);
  document.getElementById("readouts").innerHTML=`
    <div class="ro"><div class="v">${fmt(tot)}</div><div class="k">小组总 IP</div></div>
    <div class="ro"><div class="v" style="color:var(--ink2)">${fmt(tb)}</div><div class="k">${baseLabel}</div></div>
    <div class="ro"><div class="v">${deltaHtml(tot,tb)}</div><div class="k">环比</div></div>
    <div class="ro"><div class="v" style="color:var(--good)">${G}</div><div class="k">有效域名 / 共 ${D}</div></div>
    <div class="ro"><div class="v" style="color:${gap>=2?"var(--bad)":"var(--warn)"}">${gap.toFixed(1)}×</div><div class="k">首末差距</div></div>`;
}

function paintBays({cur,base,baseLabel,nDays,dates,dayLabel}){
  const ranked=[...MEMBERS].sort((a,b)=>cur[b].ip-cur[a].ip);
  let h='<div class="bays">';
  for(const m of MEMBERS){
    const c=cur[m], sp=tierSplit(c.dom,nDays,S.th), tot=Object.keys(c.dom).length;
    const pos=ranked.indexOf(m)+1;
    const ratio=base[m]?c.ip/base[m]:0;
    const series=dates.map(d=>{const dc=S.cache.get(d);return (dc&&dc.m&&dc.m[m]&&dc.m[m].t[0])||0;});
    h+=`<section class="bay" style="--mc:${MCOL[m]}">
      <div class="hd"><b>${m}</b><span class="pos ${pos===1?"p1":""}">#${pos}</span></div>
      <div class="gaugebox">
        ${gauge(ratio,MHEX[m])}
        <div class="gstat">
          <div class="big">${fmt(c.ip)}</div>
          <div class="cap">${dayLabel}</div>
          <div class="cmp"><span>${baseLabel} ${fmt(base[m])}</span>${deltaHtml(c.ip,base[m])}</div>
        </div>
      </div>
      <div class="meta"><span>主域名 <b>${fmt(tot)}</b></span><span>日均 <b>${fmt(Math.round(c.ip/nDays))}</b></span><span>PV <b>${fmt(c.pv)}</b></span></div>
      <div class="sparkbox">${spark(series,MHEX[m])}</div>
      <div class="tierbar">
        ${tbBtn(m,"good","有效",sp.good,"var(--good)")}
        ${tbBtn(m,"mid","中等",sp.mid,"var(--warn)")}
        ${tbBtn(m,"bad","无效",sp.bad,"var(--bad)")}
      </div>
      ${["good","mid","bad"].map(k=>{
        const rows=sp[k], id=m+"-"+k;
        return S.open[id]?`<div class="dl on"><ul>${rows.slice(0,200).map(r=>
          `<li><span>${esc(r[0])}</span><span>${fmt(r[1])} · 日均 ${r[2]<10?r[2].toFixed(1):Math.round(r[2])}</span></li>`).join("")
          ||'<li><span style="color:var(--ink4)">这一档没有域名</span></li>'}</ul>${
          rows.length>200?`<div class="mo">还有 ${rows.length-200} 个未显示</div>`:""}</div>`:"";
      }).join("")}

function paintTables({cur,base,baseLabel,nDays}){
  const ranked=[...MEMBERS].sort((a,b)=>cur[b].ip-cur[a].ip);
  const sp={}; MEMBERS.forEach(m=>sp[m]=tierSplit(cur[m].dom,nDays,S.th));
  let T={ip:0,pv:0,dom:0,g:0,m:0,b:0,gip:0,base:0};
  let rows="";
  for(const m of ranked){
    const c=cur[m], s=sp[m], tot=Object.keys(c.dom).length;
    const gip=s.good.reduce((a,r)=>a+r[1],0);
    T.ip+=c.ip;T.pv+=c.pv;T.dom+=tot;T.g+=s.good.length;T.m+=s.mid.length;T.b+=s.bad.length;T.gip+=gip;T.base+=base[m];
    rows+=`<tr><td><span class="who"><i style="background:${MHEX[m]}"></i>${m}</span></td>
      <td class="n">${fmt(c.ip)}</td><td class="n">${fmt(Math.round(c.ip/nDays))}</td>
      <td class="n" style="color:var(--ink3)">${fmt(base[m])}</td><td class="n">${deltaHtml(c.ip,base[m])}</td>
      <td class="n">${fmt(c.pv)}</td><td class="n">${fmt(tot)}</td>
      <td class="n" style="color:var(--good);font-weight:700">${s.good.length}</td>
      <td class="n" style="color:var(--warn)">${s.mid.length}</td>
      <td class="n" style="color:var(--bad)">${s.bad.length}</td>
      <td class="n">${tot?(s.good.length/tot*100).toFixed(1):0}%</td>
      <td class="n">${fmt(gip)} <span style="color:var(--ink4)">(${c.ip?Math.round(gip/c.ip*100):0}%)</span></td></tr>`;
  }
  let h=`<section class="panel"><div class="phd"><h2>并排对比</h2><span class="hint">按 IP 排名</span></div>
    <div class="tbl"><table><thead><tr><th>成员</th><th class="n">IP</th><th class="n">日均</th>
    <th class="n">${baseLabel}</th><th class="n">环比</th><th class="n">PV</th><th class="n">主域名</th>
    <th class="n">有效</th><th class="n">中等</th><th class="n">无效</th><th class="n">有效占比</th>
    <th class="n">有效域名贡献</th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>小组合计</td><td class="n">${fmt(T.ip)}</td><td class="n">${fmt(Math.round(T.ip/nDays))}</td>
    <td class="n">${fmt(T.base)}</td><td class="n">${deltaHtml(T.ip,T.base)}</td><td class="n">${fmt(T.pv)}</td>
    <td class="n">${fmt(T.dom)}</td><td class="n">${T.g}</td><td class="n">${T.m}</td><td class="n">${T.b}</td>
    <td class="n">${T.dom?(T.g/T.dom*100).toFixed(1):0}%</td><td class="n">${fmt(T.gip)}</td></tr></tfoot>
    </table></div></section>`;

  const all=[]; MEMBERS.forEach(m=>sp[m].good.forEach(r=>all.push([m,r[0],r[1],r[2]])));
  all.sort((a,b)=>b[2]-a[2]);
  h+=`<section class="panel"><div class="phd"><h2>有效域名榜</h2>
      <span class="hint">日均 ≥ ${S.th.good} · 共 ${all.length} 个</span></div><div class="tbl"><table>
      <thead><tr><th class="n">#</th><th>域名</th><th>归属</th><th class="n">区间 IP</th><th class="n">日均</th></tr></thead><tbody>`;
  h+= all.length? all.slice(0,80).map((r,i)=>
      `<tr><td class="n" style="color:var(--ink4)">${i+1}</td><td class="dom">${esc(r[1])}</td>
       <td><span class="who"><i style="background:${MHEX[r[0]]}"></i>${r[0]}</span></td>
       <td class="n">${fmt(r[2])}</td><td class="n">${r[3]<10?r[3].toFixed(1):Math.round(r[3])}</td></tr>`).join("")
    : '<tr><td colspan="5" style="text-align:center;color:var(--ink4);padding:26px">这个区间没有域名达到有效线。</td></tr>';
  return h+"</tbody></table></div></section>";
}

function drawStack(dates){
  const box=document.getElementById("stack"); if(!box) return;
  const W=860,H=196,PL=50,PR=10,PT=12,PB=26;
  const tot=dates.map(d=>{const dc=S.cache.get(d);
    return MEMBERS.map(m=>(dc&&dc.m&&dc.m[m]&&dc.m[m].t[0])||0);});
  const sums=tot.map(a=>a.reduce((x,y)=>x+y,0)), max=Math.max(...sums,1);
  const bw=(W-PL-PR)/Math.max(dates.length,1), y=v=>PT+(H-PT-PB)*(1-v/max);
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;display:block" role="img" aria-label="每日 IP 堆叠柱状图">`;
  [0,max/2,max].forEach(v=>{
    s+=`<line x1="${PL}" x2="${W-PR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--rule)"/>
        <text x="${PL-7}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end" fill="var(--ink4)" font-size="9.5"
        font-family="JetBrains Mono, monospace">${Math.round(v).toLocaleString("en-US")}</text>`;});
  const step=Math.max(1,Math.ceil(dates.length/12));
  dates.forEach((d,i)=>{
    let acc=0; const x=PL+bw*i+bw*.14, w=bw*.72;
    MEMBERS.forEach(m=>{const v=tot[i][MEMBERS.indexOf(m)]; if(!v) return;
      const yT=y(acc+v), yB=y(acc);
      s+=`<rect x="${x.toFixed(1)}" y="${yT.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(.6,yB-yT).toFixed(1)}" fill="${MHEX[m]}" opacity=".85"><title>${d} ${m} ${v}</title></rect>`;
      acc+=v;});
    if(i%step===0||i===dates.length-1)
      s+=`<text x="${(x+w/2).toFixed(1)}" y="${H-9}" text-anchor="middle" fill="var(--ink4)" font-size="9.5"
          font-family="JetBrains Mono, monospace">${d.slice(5)}</text>`;});
  box.innerHTML=s+"</svg>";
}

function diagnose({cur,base,nDays}){
  const out=[], sp={}; MEMBERS.forEach(m=>sp[m]=tierSplit(cur[m].dom,nDays,S.th));
  const ranked=[...MEMBERS].sort((a,b)=>cur[b].ip-cur[a].ip);
  const top=ranked[0], last=ranked[ranked.length-1];
  out.push(["var(--cyan)","排名",
    ranked.map((m,i)=>`${i+1}·<b>${m}</b> ${fmt(cur[m].ip)}`).join("　")+
    `　｜　第一名是末位的 <b>${(cur[top].ip/Math.max(cur[last].ip,1)).toFixed(1)} 倍</b>`]);

  MEMBERS.filter(m=>base[m]>0&&(cur[m].ip-base[m])/base[m]<-0.2)
    .sort((a,b)=>(cur[a].ip-base[a])/base[a]-(cur[b].ip-base[b])/base[b])
    .forEach(m=>out.push(["var(--bad)","掉量",
      `<b>${m}</b> 比基准少 <b>${Math.abs(Math.round((cur[m].ip-base[m])/base[m]*100))}%</b>（${fmt(base[m])} → ${fmt(cur[m].ip)}）`]));

  MEMBERS.filter(m=>sp[m].good.length<=1).forEach(m=>out.push(["var(--bad)","无支柱",
    `<b>${m}</b> 只有 <b>${sp[m].good.length}</b> 个有效域名，全靠零散流量堆，单个域名被 K 就没缓冲`]));

  MEMBERS.forEach(m=>{const g=sp[m].good;
    if(g.length&&cur[m].ip&&g[0][1]/cur[m].ip>0.35)
      out.push(["var(--warn)","过度集中",
        `<b>${m}</b> 的 <code>${esc(g[0][0])}</code> 独占他 <b>${Math.round(g[0][1]/cur[m].ip*100)}%</b> 的量`]);});

  MEMBERS.forEach(m=>{const s=sp[m], t=s.good.length+s.mid.length+s.bad.length;
    if(t>=20&&s.bad.length/t>0.75) out.push(["var(--warn)","空转",
      `<b>${m}</b> ${t} 个主域名里 <b>${s.bad.length} 个</b>（${Math.round(s.bad.length/t*100)}%）日均不到 ${S.th.bad} IP`]);});

  if(out.length===1) out.push(["var(--good)","正常","除排名差距外，这个区间没有触发其他告警。"]);
  return out.map(([sv,t,b])=>`<div class="al" style="--sv:${sv}"><span class="tag">${t}</span><span class="msg">${b}</span></div>`).join("");
}

async function weekCompare(){
  const a=document.getElementById("wkA").value, b=document.getElementById("wkB").value;
  const box=document.getElementById("weekBox");
  if(!a||!b){box.innerHTML='<span class="hint">请选两个起始日。</span>';return;}
  box.innerHTML='<span class="hint">计算中…</span>';
  const A=rangeDates(a,addDays(a,6)), B=rangeDates(b,addDays(b,6));
  await loadDays([...A,...B]);
  const ca=aggregate(A.map(d=>S.cache.get(d)).filter(Boolean));
  const cb=aggregate(B.map(d=>S.cache.get(d)).filter(Boolean));
  let r="",ta=0,tb=0,ga=0,gb=0;
  for(const m of MEMBERS){
    const g1=tierSplit(ca[m].dom,7,S.th).good.length, g2=tierSplit(cb[m].dom,7,S.th).good.length;
    ta+=ca[m].ip;tb+=cb[m].ip;ga+=g1;gb+=g2; const gd=g1-g2;
    r+=`<tr><td><span class="who"><i style="background:${MHEX[m]}"></i>${m}</span></td>
      <td class="n">${fmt(ca[m].ip)}</td><td class="n">${fmt(cb[m].ip)}</td><td class="n">${deltaHtml(ca[m].ip,cb[m].ip)}</td>
      <td class="n">${g1}</td><td class="n">${g2}</td>
      <td class="n ${gd>0?"up":gd<0?"down":"flat"}" style="font-weight:700">${gd>0?"+":""}${gd}</td></tr>`;
  }
  box.innerHTML=`<div class="tbl"><table><thead><tr><th>成员</th><th class="n">${a} 起 7 天</th>
    <th class="n">${b} 起 7 天</th><th class="n">IP 变化</th><th class="n">有效域名</th>
    <th class="n">对比周</th><th class="n">增减</th></tr></thead><tbody>${r}</tbody>
    <tfoot><tr><td>合计</td><td class="n">${fmt(ta)}</td><td class="n">${fmt(tb)}</td>
    <td class="n">${deltaHtml(ta,tb)}</td><td class="n">${ga}</td><td class="n">${gb}</td>
    <td class="n">${ga-gb>0?"+":""}${ga-gb}</td></tr></tfoot></table></div>`;
}

function bindAfter(){

    S.open[b.dataset.id]=!S.open[b.dataset.id]; render();}));
  const go=document.getElementById("wkGo");

}
document.querySelectorAll("#presets button").forEach(b=>b.addEventListener("click",()=>{
  const p=b.dataset.p;
  if(p==="today") setRange(S.latest,S.latest,"today");
  else if(p==="yday"){const y=addDays(S.latest,-1); setRange(y,y,"yday");}
  else setRange(addDays(S.latest,-(+p-1)),S.latest,p);
}));
document.getElementById("d1").addEventListener("change",e=>{S.d1=e.target.value;S.preset="";
  document.querySelectorAll("#presets button").forEach(x=>x.setAttribute("aria-pressed","false"));render();});
document.getElementById("d2").addEventListener("change",e=>{S.d2=e.target.value;S.preset="";
  document.querySelectorAll("#presets button").forEach(x=>x.setAttribute("aria-pressed","false"));render();});
document.getElementById("thBad").addEventListener("change",e=>{
  S.th.bad=Math.max(1,+e.target.value||5); if(S.th.good<=S.th.bad){S.th.good=S.th.bad+1;document.getElementById("thGood").value=S.th.good;} render();});
document.getElementById("thGood").addEventListener("change",e=>{
  S.th.good=Math.max(S.th.bad+1,+e.target.value||30); e.target.value=S.th.good; render();});

/* 挂在副屏上当驾驶舱用：15 分钟自动刷一次，
   但最近 5 分钟内有人在操作就先不打断。 */
let lastTouch=Date.now();
["click","keydown","input"].forEach(ev=>
  document.addEventListener(ev,()=>{lastTouch=Date.now();},true));
setInterval(()=>{ if(Date.now()-lastTouch>5*60*1000) location.reload(); },15*60*1000);

  const KEY="seoboard.pw", enc=new TextEncoder();
  const form=document.getElementById("lockform"), pw=document.getElementById("lkpw"),
        go=document.getElementById("lkgo"), msg=document.getElementById("lkmsg");

  async function unlock(pass,quiet){
    go.disabled=true; msg.className="lk-msg"; msg.textContent="解密中…";
    try{
      const base=await crypto.subtle.importKey("raw",enc.encode(pass),"PBKDF2",false,["deriveKey"]);
      const key=await crypto.subtle.deriveKey(
        {name:"PBKDF2",salt:SALT,iterations:310000,hash:"SHA-256"},
        base,{name:"AES-GCM",length:256},false,["decrypt"]);
      const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:NONCE},key,CT);
      let text;
      if(typeof DecompressionStream!=="undefined"){
        text=await new Response(new Blob([plain]).stream()
          .pipeThrough(new DecompressionStream("gzip"))).text();
      }else{ throw new Error("浏览器太旧，请换 Chrome 或新版 Safari"); }
      window.__DATA__=JSON.parse(text);
      try{ localStorage.setItem(KEY,pass); }catch(e){}
      document.getElementById("lockscreen").remove();
      window.__BOOT__();
    }catch(e){
      go.disabled=false;
      try{ localStorage.removeItem(KEY); }catch(_){}
      if(quiet){ msg.className="lk-msg"; msg.textContent="密码只在你这台设备上记住，不会上传。"; }
      else{ msg.className="lk-msg err"; msg.textContent="密码不对，再试一次。"; pw.select(); }
    }
  }
  form.addEventListener("submit",e=>{e.preventDefault(); if(pw.value) unlock(pw.value,false);});
  let saved=null; try{ saved=localStorage.getItem(KEY); }catch(e){}
  if(saved) unlock(saved,true);
})();
